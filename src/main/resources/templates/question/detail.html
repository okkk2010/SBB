<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">


<div layout:fragment="content" class="container my-3">
    <!-- 질문 및 답변 목록 Card -->
    <div class="card shadow-sm mb-4">

        <!-- 질문 제목 -->
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${question.subject}">질문 제목</h4>
        </div>

        <div class="card-body">

            <!-- 질문 내용 -->
            <div class="mb-4">
                <p class="card-text" style="white-space: pre-line;"
                   th:text="${question.content}">
                    질문 내용
                </p>
            </div>

            <hr>

            <!-- 답변 개수 -->
            <h5 class="mb-3">
                답변
                <span class="badge bg-secondary"
                      th:text="${#lists.size(question.answerList)}">
        0
    </span>
                <small class="text-muted">개의 답변이 있습니다.</small>
            </h5>

            <!-- 답변이 없는 경우 -->
            <div th:if="${#lists.isEmpty(question.answerList)}"
                 class="alert alert-light text-muted">
                아직 등록된 답변이 없습니다.
            </div>

            <!-- 답변 목록: 각각 개별 카드로 표시 -->
            <div th:each="answer : ${question.answerList}"
                 class="card shadow-sm mb-3">

                <div class="card-body">
                    <p class="card-text mb-0"
                       style="white-space: pre-line;"
                       th:text="${answer.content}">
                        답변 내용
                    </p>
                </div>

            </div>


        </div>
    </div>

    <!-- 답변 등록 폼 -->
    <div class="card shadow-sm">
        <div class="card-header bg-light">
            <h5 class="mb-0">답변 작성</h5>
        </div>

        <div class="card-body">
            <form th:action="@{|/answer/create/${question.id}|}"
                  method="post">

                <div class="mb-3">
                    <label for="content" class="form-label">
                        답변 내용
                    </label>

                    <textarea
                            class="form-control"
                            rows="6"
                            id="content"
                            name="content"
                            placeholder="답변을 입력하세요."
                            required></textarea>
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-primary">
                        답변 등록
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
</html>
